{% extends 'base.html' %}

{% block content %}
<head>
    <title>New Polling Unit Results</title>
</head>
<body>
    <h1>Enter New Polling Unit Results</h1>
    
    <form method="post">
        {% csrf_token %}
        {{ form.polling_unit.label_tag }} {{ form.polling_unit }}
        
        <h2>Party Results:</h2>
        {% for party in parties %}
        <div>
            <label>{{ party.partyname }}:</label>
            <input type="number" name="party_{{ party.partyid }}" min="0" required>
        </div>
        {% endfor %}
        
        <button type="submit">Submit Results</button>
    </form>
</body>

{% endblock %}

{% block scripts %}
<script src="https://unpkg.com/htmx.org@1.9.0"></script>
{% endblock %}
